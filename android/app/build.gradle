plugins { id 'com.android.application' }
android {
    namespace 'ua.mizhnamy.app'
    compileSdk 34
    defaultConfig {
        applicationId "ua.mizhnamy.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        fixed {
            storeFile file('mizhnamy.keystore')
            storePassword 'mizhnamy123'
            keyAlias 'mizhnamy'
            keyPassword 'mizhnamy123'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.fixed }
        debug { signingConfig signingConfigs.fixed }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false; checkReleaseBuilds false }
}
