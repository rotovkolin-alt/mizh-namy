<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Між нами</title>
<meta name="theme-color" content="#FBF3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Між нами">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#FBF3EE; --card:#FFFFFF; --ink:#2A1A22; --muted:#8A7580; --line:#EEDFD8;
  --rose:#D63F6A; --rose-2:#F06A8D; --rose-soft:#FCE4EA; --gold:#E7A44B; --ok:#3E9E7A;
  --shadow:0 1px 2px rgba(80,30,50,.06),0 8px 24px rgba(80,30,50,.07);
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1C1418;--card:#2A1F25;--ink:#F7EBEF;--muted:#B49FA9;--line:#3B2D34;--rose:#FF6B93;--rose-2:#FF8FAB;--rose-soft:#3D2430;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:560px;margin:0 auto;padding:12px 18px 24px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 6px}
.brand{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.5px}
.brand small{display:block;font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0;margin-top:2px}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);font-size:19px;position:relative}
.sync-dot{position:absolute;right:3px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--muted);border:2px solid var(--card)}
.sync-dot.ok{background:var(--ok)}.sync-dot.err{background:#D9534F}.sync-dot.busy{background:var(--gold)}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin:14px 0}
.card h3{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hero{background:linear-gradient(140deg,var(--rose) 0%,var(--rose-2) 100%);color:#fff;position:relative;overflow:hidden}
.hero h3{color:rgba(255,255,255,.8)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.task-text{font-family:var(--serif);font-size:23px;line-height:1.28;margin:10px 0 16px;position:relative;z-index:1}
.tag{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.2)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap-row{flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:16px;font-weight:600;background:var(--rose);color:#fff;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.white{background:#fff;color:var(--rose)}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.btn.soft{background:var(--rose-soft);color:var(--rose)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn.sm{height:38px;padding:0 14px;border-radius:12px;font-size:14px}
.btn[disabled]{opacity:.5}
.people{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1;flex-wrap:wrap}
.pill{font-size:13px;padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.18);display:inline-flex;gap:6px;align-items:center}
.pill.done{background:#fff;color:var(--rose);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.q{font-family:var(--serif);font-size:20px;line-height:1.3;margin:8px 0 12px}
textarea,input[type=text],input[type=url],input[type=date]{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;outline:none;font-size:16px;resize:none}
textarea:focus,input:focus{border-color:var(--rose)}
.answer{background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:10px}
.answer b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.locked{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:10px}
.moods{display:flex;justify-content:space-between;margin-top:10px}
.mood{width:52px;height:52px;border-radius:16px;font-size:28px;display:grid;place-items:center;background:var(--bg);transition:transform .15s}
.mood.on{background:var(--rose-soft);transform:scale(1.1);box-shadow:inset 0 0 0 2px var(--rose)}
.ping{width:100%;height:64px;border-radius:20px;font-size:18px;font-weight:700;background:var(--card);box-shadow:var(--shadow);color:var(--rose);display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0}
.ping:active{transform:scale(.98)}
.banner{display:flex;gap:12px;align-items:center;background:var(--rose-soft);color:var(--ink);border-radius:18px;padding:14px 16px;margin:12px 0;animation:pop .5s ease}
.banner .big{font-size:28px;animation:beat 1.2s infinite}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border-radius:18px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--serif);font-size:26px}
.stat span{font-size:12px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:#fff;margin-top:1px}
.check.on{background:var(--ok);border-color:var(--ok)}
.item.done .txt{text-decoration:line-through;color:var(--muted)}
.del{color:var(--muted);font-size:18px;padding:0 4px}
.note{border-radius:18px;padding:12px 14px;margin:10px 0;max-width:86%;position:relative;white-space:pre-wrap;word-wrap:break-word}
.note.me{background:var(--rose);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.note.them{background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.note .meta{font-size:11px;opacity:.7;margin-top:4px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px;max-height:140px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-family:var(--serif);font-size:20px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dow{font-size:11px;color:var(--muted);font-weight:600;padding-bottom:4px}
.day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;background:var(--bg);position:relative}
.day .h{font-size:13px;line-height:1;margin-top:2px;height:13px}
.day.today{box-shadow:inset 0 0 0 2px var(--rose)}
.day.both{background:var(--rose);color:#fff}
.day.one{background:var(--rose-soft)}
.day.future{opacity:.35}
.day.empty{background:transparent}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:20}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:600;min-width:64px;padding:4px}
nav.tabs button .i{font-size:22px;filter:grayscale(1);opacity:.6;transition:.2s}
nav.tabs button.on{color:var(--rose)}
nav.tabs button.on .i{filter:none;opacity:1;transform:translateY(-1px)}
.sheet-bg{position:fixed;inset:0;background:rgba(20,8,14,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet h2{font-family:var(--serif);font-size:24px;margin:4px 0 12px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(100%)}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:80;animation:pop .3s;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.onb{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:480px;margin:0 auto}
.onb h1{font-family:var(--serif);font-size:40px;margin:0 0 8px;letter-spacing:-.5px}
.onb p{color:var(--muted);margin:0 0 22px}
.onb .heart{font-size:64px;margin-bottom:14px;animation:beat 1.6s infinite;display:inline-block}
.choice{display:block;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:16px 18px;margin:10px 0;box-shadow:var(--shadow)}
.choice b{display:block;font-size:17px}
.choice span{font-size:14px;color:var(--muted)}
.field{margin:12px 0}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:12px;word-break:break-all;user-select:all;-webkit-user-select:all}
.hint{font-size:13px;color:var(--muted);margin:6px 0}
.steps{padding-left:20px;margin:8px 0}.steps li{margin:6px 0}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.seg button{flex:1;height:38px;border-radius:11px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--rose);color:#fff}
.empty-st{text-align:center;color:var(--muted);padding:26px 10px}
.empty-st .e{font-size:40px;display:block;margin-bottom:6px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:22px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.6}}
.section-title{font-family:var(--serif);font-size:26px;margin:18px 2px 4px}
.sub{color:var(--muted);font-size:14px;margin:0 2px 8px}
.done-note{margin-top:10px;font-size:14px;background:rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;position:relative;z-index:1}
</style>
</head>
<body>
<div id="app"></div>
<script src="tasks.js"></script>
<script src="app.js"></script>
</body>
</html>
